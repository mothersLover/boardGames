spring:
  mvc:
    cors:
      allowed-origins=*:

  datasource:
    url: jdbc:postgresql://localhost:5432/boardgames
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
#  security:
#    oauth2:
#      resourceserver:
#        jwt:
#          issuer-uri: http://localhost:8081/realms/boardgames
server:
  port: 8080
  tomcat:
    # По умолчанию у Tomcat свои (независимые от spring.servlet.multipart) лимиты
    # на тело POST-запроса — при их превышении соединение сбрасывается (RST),
    # браузер видит net::ERR_CONNECTION_RESET, а не аккуратный HTTP-ответ.
    max-http-form-post-size: 200MB
    max-swallow-size: -1

logging:
  level:
    com.family: DEBUG

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: boardgame
  secure: false

app:
  base-url: http://localhost:8080
  minio-public-url: http://localhost:9000