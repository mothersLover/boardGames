# 127.0.0.11 — встроенный DNS Docker. Адреса backend/minio резолвятся на каждый запрос
# (через переменные ниже), поэтому после пересборки/перезапуска контейнера nginx не
# «залипает» на старый IP и не отдаёт 502.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # Загрузка аудио/видео через админку (см. лимиты в application.yml бэкенда).
    client_max_body_size 200m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Публичное чтение файлов из MinIO (логотипы, музыка, видео, инструкции).
    location /storage/ {
        limit_except GET HEAD {
            deny all;
        }
        set $minio http://minio:9000;
        rewrite ^/storage/(.*)$ /$1 break;
        proxy_pass $minio;
        proxy_http_version 1.1;
        proxy_set_header Host minio:9000;
        proxy_buffering off;
    }

    # Файлы сборки CRA имеют хэш в имени — можно кэшировать надолго.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: любые остальные пути отдаём index.html, дальше маршрутизирует react-router.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
